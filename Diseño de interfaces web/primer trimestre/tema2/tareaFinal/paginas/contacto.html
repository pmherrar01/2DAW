<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HERROR - Contacto</title>
  <link rel="stylesheet" href="../estiloPractica2.css">
</head>
<body>

  <header class="limpiar-flotados">
    <div class="mi-logo">HERROR</div>
    <nav>
      <a href="../index.html">Inicio</a>
      <a href="colecciones.html">Colecciones</a>
      <a href="sobre_nosotros.html">Sobre Nosotros</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <section class="portada-pequena">
    <div class="contenido-portada">
      <h1>CONTÁCTANOS</h1>
    </div>
  </section>

  <section class="seccion-contacto">
    <h2>¿TIENES ALGUNA DUDA?</h2>
    <p>Rellena el formulario y te responderemos en 24h.</p>
    
    <form action="#" method="post" style="margin-top: 40px;">
      <input type="text" name="nombre" placeholder="Tu nombre" required>
      <input type="email" name="email" placeholder="Tu correo electrónico" required>
      <textarea name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
      
      <button type="submit" class="boton boton-azulito" style="margin-top: 20px;">ENVIAR MENSAJE</button>
    </form>
  </section>

  <footer class="limpiar-flotados">
    <div style="max-width: 1200px; margin: 0 auto;">
      <div class="pie-izquierda">HERROR</div>
      <div class="pie-derecha">
        <a href="contacto.html">Contacto</a>
        <a href="#">Envíos</a>
        <a href="#">Privacidad</a>
      </div>
    </div>
  </footer>

</body>
</html>
